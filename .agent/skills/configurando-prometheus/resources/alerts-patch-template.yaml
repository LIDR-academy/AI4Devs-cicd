apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-server
  namespace: monitoring
data:
  alerting_rules.yml: |
    groups:
    - name: CustomAlerts
      rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: page
        annotations:
          description: 'Instance {{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute.'
          summary: 'Instance {{ $labels.instance }} down'
