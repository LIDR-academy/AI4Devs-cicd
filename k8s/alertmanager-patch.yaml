apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alertmanager
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    receivers:
    - name: 'n8n-webhook'
      webhook_configs:
      - url: 'http://n8n.default.svc.cluster.local:5678/webhook/prometheus-alert'
        send_resolved: true
    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'n8n-webhook'
