apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: n8n-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: n8n-sa-admin-binding
subjects:
  - kind: ServiceAccount
    name: n8n-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: default
  labels:
    app: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      serviceAccountName: n8n-sa
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:latest
          command:
            - sh
            - -c
            - |
              echo "Installing kubectl..."
              mkdir -p /home/node/.local/bin
              if [ ! -f /home/node/.local/bin/kubectl ]; then
                wget -O /home/node/.local/bin/kubectl "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
                chmod +x /home/node/.local/bin/kubectl
              fi
              export PATH="/home/node/.local/bin:$PATH"
              echo "Starting n8n..."
              exec n8n
          ports:
            - containerPort: 5678
              name: http
          env:
            - name: N8N_PORT
              value: "5678"
            - name: N8N_BASIC_AUTH_ACTIVE
              value: "false"
            - name: N8N_USER_MANAGEMENT_DISABLED
              value: "true"
            - name: NODE_FUNCTION_ALLOW_EXTERNAL
              value: "*"
            - name: PATH
              value: "/home/node/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          volumeMounts:
            - name: n8n-storage
              mountPath: /home/node/.n8n
          resources:
            requests:
              memory: "250Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: n8n-storage
          persistentVolumeClaim:
            claimName: n8n-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: default
spec:
  ports:
    - port: 5678
      targetPort: 5678
      name: http
  selector:
    app: n8n
  type: ClusterIP
